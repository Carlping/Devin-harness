[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-fanout"
version = "0.1.0"
description = "Reproducible fan-out analysis harness for Devin API sessions"
requires-python = ">=3.11"
dependencies = [
  "requests",
  "PyYAML",
  "jsonschema",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::RuntimeWarning"]
